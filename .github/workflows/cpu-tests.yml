name: CPU Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-cpu.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"
          python -m pip install -r tests/requirements-cpu.txt

      - name: Build native text tests
        run: |
          cmake -S tests/text -B build/cpu-text -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpu-text -j

      - name: Run CPU tests
        env:
          NINFER_JINJA_TEST: ${{ github.workspace }}/build/cpu-text/ninfer_jinja_test
        run: |
          ctest --test-dir build/cpu-text --output-on-failure
          python -m pytest tests
          PYTHONPATH=eval python -m unittest discover -s eval/tests -p 'test_*.py'
